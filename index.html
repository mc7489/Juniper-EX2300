function runCliCommand(cmd) {
  if (!cmd) return '';
  if (cmd === '?' || cmd === 'help') {
    return ['Available commands:',
      '  show interfaces terse|extensive [name]',
      '  show vlans',
      '  show ethernet-switching table',
      '  show route',
      '  show arp',
      '  show lldp neighbors',
      '  show configuration',
      '  show system uptime',
      '  show chassis hardware',
      '  show version',
      '  show system commit',
      '  show system alarms',
      '  show poe interface',
      '  show spanning-tree bridge',
      '  show bgp summary',
      '  show ospf neighbor',
      '  show system processes',
      '  show log messages',
      '  ping <host> | traceroute <host>',
      '  clear | exit'
    ].join('\n');
  }
  if (cmd === 'exit' || cmd === 'quit') return 'Connection closed by remote host.';
  if (cmd === 'clear') return null; // handled separately

  if (cmd.startsWith('ping ')) {
    const host = cmd.split(/\s+/)[1];
    return `PING ${host}: 56 data bytes\n64 bytes from ${host}: icmp_seq=0 ttl=64 time=0.412 ms\n64 bytes from ${host}: icmp_seq=1 ttl=64 time=0.398 ms\n^C\n--- ${host} ping statistics ---\n2 packets transmitted, 2 packets received, 0% packet loss\nround-trip min/avg/max/stddev = 0.398/0.405/0.412/0.007 ms`;
  }
  if (cmd.startsWith('traceroute ')) {
    const host = cmd.split(/\s+/)[1];
    return `traceroute to ${host}, 30 hops max\n 1  10.0.1.1   0.5 ms  0.4 ms  0.6 ms\n 2  ${host}   1.2 ms  1.1 ms  1.4 ms`;
  }

  if (cmd === 'show version') {
    const s = state.system;
    return `Hostname: ${s.hostname}\nModel: ${s.model||'ex2300-48t-mp'}\nJunos: ${s.junos||'22.4R3.25'}\nJUNOS OS Kernel 64-bit  [20240114.181818_builder_stable_12]\nJUNOS OS libs [20240114.181818_builder_stable_12]\nJUNOS OS runtime [20240114.181818_builder_stable_12]\nJUNOS Web Management Platform Package [22.4R3.25]\nJUNOS jweb [22.4R3.25]\nJUNOS py-extensions [22.4R3.25]\nJUNOS py-base [22.4R3.25]\nJUNOS py-base-arm [22.4R3.25]`;
  }

  if (cmd === 'show system uptime') {
    const u = state.system.uptime || '12 days, 4:32';
    return `Current time: ${new Date().toISOString().replace('T',' ').slice(0,19)} UTC\nSystem booted: ${new Date(Date.now()-12*86400*1000).toISOString().replace('T',' ').slice(0,19)} UTC (${u} ago)\nProtocols started: ${new Date(Date.now()-12*86400*1000+30000).toISOString().replace('T',' ').slice(0,19)} UTC\nLast configured: ${state.config.history?.[state.config.history.length-1]?.date || 'never'} UTC by admin\n10:32AM  up ${u}, 2 users, load averages: 0.41, 0.45, 0.52`;
  }

  if (cmd === 'show chassis hardware') {
    const s = state.system;
    return `Hardware inventory:\nItem             Version  Part number   Serial number     Description\nChassis                                ${s.serial||'PE3722340123'}      ${s.model||'EX2300-48T-MP'}\nPseudo CB 0\nRouting Engine 0 REV 28  650-073039    PE3722340123      RE-EX2300-48T-MP\nFPC 0            REV 28  650-073039    PE3722340123      EX2300-48T-MP\n  CPU            REV 06  BUILTIN       BUILTIN           FPC CPU\n  PIC 0                  BUILTIN       BUILTIN           48x10/100/1000 BASE-T MP\n  PIC 1                  BUILTIN       BUILTIN           4x1G/10G SFP+\nPower Supply 0           740-067272    1GBM2380046       JPSU-740W-AC-AFO\nPower Supply 1                                           Absent\nFan Tray 0                                               Fan Tray 0\nFan Tray 1                                               Fan Tray 1`;
  }

  if (cmd === 'show interfaces terse' || cmd === 'show interfaces') {
    let out = 'Interface               Admin Link Proto    Local                 Remote\n';
    (state.interfaces||[]).slice(0,30).forEach(i=>{
      const admin = i.disabled ? 'down' : 'up';
      const link = i.disabled ? 'down' : (i.linkUp===false?'down':'up');
      out += `${i.name.padEnd(24)}${admin.padEnd(6)}${link.padEnd(5)}`;
      if (i.family === 'inet') {
        out += `inet     ${i.address||''}\n`;
      } else if (i.family === 'ethernet-switching') {
        out += `eth-switch\n`;
      } else {
        out += `\n`;
      }
    });
    return out;
  }

  if (cmd.startsWith('show interfaces ') && (cmd.includes('extensive') || cmd.includes('detail'))) {
    const parts = cmd.split(/\s+/);
    const ifname = parts[2] && !['extensive','detail'].includes(parts[2]) ? parts[2] : 'ge-0/0/0';
    const i = (state.interfaces||[]).find(x=>x.name===ifname);
    if (!i) return `error: interface "${ifname}" not found`;
    return `Physical interface: ${i.name}, Enabled, Physical link is ${i.linkUp===false?'Down':'Up'}\n  Interface index: 503, SNMP ifIndex: 522\n  Link-level type: Ethernet, MTU: ${i.mtu||1514}, Speed: ${i.speed||'1000mbps'}, BPDU Error: None\n  Loopback: Disabled, Source filtering: Disabled, Flow control: Enabled, Auto-negotiation: ${i.autoNeg!==false?'Enabled':'Disabled'}\n  Device flags   : Present Running\n  Interface flags: SNMP-Traps Internal: 0x4000\n  CoS queues     : 8 supported, 8 maximum usable queues\n  Current address: ${i.mac||'00:00:5e:00:53:00'}, Hardware address: ${i.mac||'00:00:5e:00:53:00'}\n  Last flapped   : 2025-04-22 03:14:22 UTC (12d 04:32 ago)\n  Statistics last cleared: Never\n  Traffic statistics:\n   Input  bytes  : ${i.stats?.inBytes||0} (0 bps)\n   Output bytes  : ${i.stats?.outBytes||0} (0 bps)\n   Input  packets: ${i.stats?.inPkts||0} (0 pps)\n   Output packets: ${i.stats?.outPkts||0} (0 pps)`;
  }

  if (cmd === 'show vlans') {
    let out = 'Routing instance        VLAN name             Tag          Interfaces\n';
    (state.vlans||[]).forEach(v=>{
      out += `default-switch          ${v.name.padEnd(22)}${(v.id+'').padEnd(13)}\n`;
      const members = (state.interfaces||[]).filter(i=>(i.vlans||[]).includes(v.name));
      members.forEach(m=>out += `                                                            ${m.name}.0${m.linkUp===false?'*':''}\n`);
    });
    return out;
  }

  if (cmd === 'show ethernet-switching table') {
    const peer = getPeerInfo();
    let out = 'MAC flags (S - static MAC, D - dynamic MAC, L - locally learned, P - Persistent static\n           SE - statistics enabled, NM - non configured MAC, R - remote PE MAC, O - ovsdb MAC)\n\nEthernet switching table : 24 entries, 24 learned\nRouting instance : default-switch\n   Vlan                MAC                 MAC         Age    Logical                NH        RTR\n   name                address             flags              interface              Index     ID\n';
    let n = 0;
    (state.vlans||[]).slice(0,3).forEach(v=>{
      for (let i=0; i<3 && n<8; i++, n++) {
        const mac = `00:0c:29:${(0x10+n).toString(16).padStart(2,'0')}:${(0x40+n).toString(16).padStart(2,'0')}:${(0x80+n).toString(16).padStart(2,'0')}`;
        const port = `ge-0/0/${(n%48)}`;
        out += `   ${v.name.padEnd(20)}${mac}   D          - 	  ${port}.0\n`;
      }
    });
    if (peer && peer.online) {
      out += `   default             ${peer.fabricMac||'00:50:56:aa:bb:cc'}   D          - 	  ge-0/0/0.0    [via fabric → ${peer.hostname}]\n`;
    }
    return out;
  }

  if (cmd === 'show route') {
    let out = 'inet.0: 6 destinations, 6 routes (6 active, 0 holddown, 0 hidden)\n+ = Active Route, - = Last Active, * = Both\n\n';
    (state.routing?.staticRoutes||[]).forEach(r=>{
      out += `${r.destination.padEnd(20)}*[Static/${r.preference||5}] 12d 04:32:18\n                    > to ${r.nextHop} via ${r.nextHopInterface||'irb.0'}\n`;
    });
    state.interfaces.filter(i=>i.address).forEach(i=>{
      const net = i.address.split('/')[0].split('.').slice(0,3).join('.')+'.0/'+i.address.split('/')[1];
      out += `${net.padEnd(20)}*[Direct/0] 12d 04:32:18\n                    > via ${i.name}\n${i.address.split('/')[0].padEnd(20)}*[Local/0] 12d 04:32:18\n                      Local via ${i.name}\n`;
    });
    return out;
  }

  if (cmd === 'show arp') {
    const peer = getPeerInfo();
    let out = 'MAC Address       Address         Name                      Interface           Flags\n';
    if (peer && peer.online) {
      const peerIfs = peer.interfaces || [];
      peerIfs.forEach(i=>{
        if (i.address) {
          const ip = i.address.split('/')[0];
          out += `${(i.mac||'00:50:56:aa:bb:cc').padEnd(18)}${ip.padEnd(16)}${(peer.hostname||'firebox').padEnd(26)}irb.0               none\n`;
        }
      });
    }
    out += '00:50:56:c0:00:01  192.168.1.1     gateway                   me0.0               none\n';
    out += `Total entries: ${peer?.online ? 4 : 1}`;
    return out;
  }

  if (cmd === 'show lldp neighbors') {
    const peer = getPeerInfo();
    let out = 'Local Interface    Parent Interface    Chassis Id          Port info          System Name\n';
    if (peer && peer.online) {
      out += `ge-0/0/0           -                   ${peer.fabricMac||'00:50:56:aa:bb:cc'}   ${peer.fabricInterface||'Trusted'}            ${peer.hostname||'firebox'}\n`;
    } else {
      out += '(no LLDP neighbors)\n';
    }
    return out;
  }

  if (cmd === 'show configuration') {
    return generateCurlyConfig();
  }

  if (cmd === 'show system commit') {
    const hist = state.config.history || [];
    if (!hist.length) return 'No commits available';
    return hist.slice().reverse().map((h,i)=>`${(hist.length-1-i)}\t${h.date}\tby ${h.user||'admin'} via ${h.client||'jweb'}\n${h.comment?'  '+h.comment:''}`).join('\n');
  }

  if (cmd === 'show system alarms') {
    return 'No alarms currently active';
  }

  if (cmd === 'show poe interface') {
    let out = 'Interface  Admin status  Oper status  Max power  Priority  Power consumption  Class\n';
    (state.interfaces||[]).filter(i=>i.poe?.enabled).slice(0,12).forEach(i=>{
      out += `${i.name.padEnd(11)}${(i.poe.adminStatus||'Enabled').padEnd(14)}${(i.poe.operStatus||'OFF').padEnd(13)}${(i.poe.maxPower+'W').padEnd(11)}${(i.poe.priority||'low').padEnd(10)}${((i.poe.consumption||0)+'.0W').padEnd(19)}${i.poe.class||'0'}\n`;
    });
    return out;
  }

  if (cmd === 'show spanning-tree bridge') {
    const r = state.protocols?.rstp||{};
    return `STP bridge parameters\nContext ID                      : 0\nEnabled protocol                : ${(r.enabled?'RSTP':'disabled')}\nRoot ID                         : ${r.priority||32768}.${state.system.hostname}\nHello time                      : ${r.helloTime||2} seconds\nMaximum age                     : ${r.maxAge||20} seconds\nForward delay                   : ${r.forwardDelay||15} seconds\nMessage age                     : 0\nNumber of topology changes      : 14\nTime since last topology change : 1d 12h 14m`;
  }

  if (cmd === 'show bgp summary') {
    const b = state.protocols?.bgp;
    if (!b?.enabled) return 'BGP is not running';
    return `Groups: ${(b.groups||[]).length} Peers: 0 Down peers: 0\nLocal AS: ${b.localAs||65000}\nPeer                      AS  InPkt OutPkt  OutQ Flaps Last Up/Down State|#Active/Received/Accepted/Damped...`;
  }

  if (cmd === 'show ospf neighbor') {
    const o = state.protocols?.ospf;
    if (!o?.enabled) return 'OSPF instance is not running';
    return 'Address          Interface              State     ID               Pri  Dead\n(no neighbors)';
  }

  if (cmd === 'show system processes') {
    return ' PID  TT  STAT      TIME COMMAND\n   1  ??  Ss     0:01.42 /sbin/init --\n  17  ??  IsJ    0:00.05 mountd\n  88  ??  Ss     0:00.41 /usr/sbin/syslogd -s\n 132  ??  Ss     0:01.84 /usr/sbin/inetd -wW\n 145  ??  Ss     0:08.12 /usr/sbin/sshd\n 211  ??  Ss     2:14.34 /usr/sbin/mgd\n 218  ??  Ss     1:43.21 /usr/sbin/dcd\n 220  ??  Ss     0:54.32 /usr/sbin/rpd\n 231  ??  Ss     1:24.18 /usr/sbin/eswd\n 235  ??  Ss     0:32.41 /usr/sbin/chassisd\n 240  ??  Ss     0:14.21 /usr/sbin/snmpd\n 254  ??  Ss     0:08.41 /usr/sbin/lldpd\n 268  ??  Ss     0:02.81 /usr/sbin/ntpd\n 290  ??  Ss     0:21.42 /usr/sbin/jweb';
  }

  if (cmd === 'show log messages' || cmd.startsWith('show log ')) {
    return synthesizeLogContent('messages');
  }

  if (cmd === 'show system storage') {
    return 'Filesystem              Size       Used      Avail  Capacity   Mounted on\n/dev/gpt/junos          1.7G       1.1G       520M       68%  /\n/dev/md0                320M        16M       278M        5%  /tmp\n/dev/gpt/var            1.5G       340M       1.1G       23%  /var\n/dev/gpt/config         200M        14M       180M        7%  /config';
  }

  if (cmd === 'show snmp mib') {
    return 'sysDescr.0 = Juniper Networks, Inc. ' + (state.system.model||'ex2300-48t-mp') + ' Ethernet Switch, kernel JUNOS ' + (state.system.junos||'22.4R3.25');
  }

  return `unknown command: ${cmd}\n(type "?" for help)`;
}

// TROUBLESHOOT: Packet Capture
// ============================================================================
registerRoute('troubleshoot/packet-capture', () => {
  const c = el('div');
  const ifaceOpts = (state.interfaces||[]).map(i=>`<option>${i.name}</option>`).join('');
  c.innerHTML = `
    <div class="card"><div class="card-h"><h2>Packet Capture (monitor traffic)</h2></div><div class="card-b">
      <p class="muted">Equivalent to: <code>monitor traffic interface &lt;name&gt; matching &lt;filter&gt; count &lt;n&gt;</code></p>
      <div class="form-row"><label>Interface</label><select id="pc-if">${ifaceOpts}</select></div>
      <div class="form-row"><label>Direction</label><select id="pc-dir"><option>both</option><option>read</option><option>write</option></select></div>
      <div class="form-row"><label>Filter (tcpdump syntax)</label><input id="pc-flt" placeholder="tcp port 80"></div>
      <div class="form-row"><label>Count</label><input id="pc-cnt" type="number" value="20"></div>
      <div class="form-row"><label>Layer 2 headers</label><select id="pc-l2"><option value="no">no</option><option value="yes">yes</option></select></div>
      <div class="form-row"><label>No DNS resolve</label><select id="pc-no-dns"><option value="yes">yes</option><option value="no">no</option></select></div>
      <div class="form-row"><label>Save to file</label><input id="pc-file" placeholder="/var/tmp/capture.pcap"></div>
      <div class="actions"><button class="btn primary" id="pc-go">Start Capture</button> <button class="btn" id="pc-clear">Clear</button></div>
      <pre id="pc-out" class="cli-output" style="margin-top:14px">(no output yet)</pre>
    </div></div>
  `;
  c.querySelector('#pc-clear').onclick=()=>c.querySelector('#pc-out').textContent='(cleared)';
  c.querySelector('#pc-go').onclick=()=>{
    const iface = c.querySelector('#pc-if').value;
    const flt = c.querySelector('#pc-flt').value;
    const cnt = parseInt(c.querySelector('#pc-cnt').value)||20;
    const peer = getPeerInfo();
    const peerIp = peer?.interfaces?.find(i=>i.zone==='Trusted')?.address?.split('/')[0] || '10.0.1.1';
    const out = c.querySelector('#pc-out');
    out.textContent = `Listening on ${iface}, capture size 96 bytes${flt?', filter "'+flt+'"':''}\n\n`;
    let i = 0;
    const timer = setInterval(()=>{
      const t = new Date().toISOString().slice(11,23);
      const samples = [
        `${t}  In IP 10.0.1.42.55421 > ${peerIp}.443: Flags [.], seq 1:1461, ack 1, win 8192, length 1460`,
        `${t}  Out IP ${peerIp}.443 > 10.0.1.42.55421: Flags [.], ack 1461, win 502, length 0`,
        `${t}  In IP 10.0.1.55.49234 > 8.8.8.8.53: 0x12ab+ A? www.example.com. (33)`,
        `${t}  Out IP 8.8.8.8.53 > 10.0.1.55.49234: 0x12ab 1/0/0 A 93.184.216.34 (49)`,
        `${t}  In ARP, Request who-has ${peerIp} tell 10.0.1.42, length 28`,
        `${t}  Out ARP, Reply ${peerIp} is-at 00:50:56:aa:bb:cc, length 28`,
      ];
      out.textContent += samples[Math.floor(Math.random()*samples.length)] + '\n';
      i++;
      if (i >= cnt) { clearInterval(timer); out.textContent += `\n${cnt} packets received by filter\n0 packets dropped by kernel\n`; }
    }, 120);
  };
  return c;
});

// TROUBLESHOOT: Cable Diagnostics (TDR)
// ============================================================================
registerRoute('troubleshoot/cable-test', () => {
  const c = el('div');
  const ifaceOpts = (state.interfaces||[]).filter(i=>i.name.startsWith('ge-')).map(i=>`<option>${i.name}</option>`).join('');
  c.innerHTML = `
    <div class="card"><div class="card-h"><h2>Cable Diagnostics (TDR)</h2></div><div class="card-b">
      <p class="muted">Equivalent to: <code>request diagnostics tdr start interface &lt;name&gt;</code></p>
      <div class="form-row"><label>Interface</label><select id="cd-if">${ifaceOpts}</select></div>
      <div class="actions"><button class="btn primary" id="cd-go">Run TDR</button> <button class="btn" id="cd-show">Show last result</button></div>
      <pre id="cd-out" class="cli-output" style="margin-top:14px">(no output yet)</pre>
    </div></div>
  `;
  c.querySelector('#cd-go').onclick=()=>{
    const iface = c.querySelector('#cd-if').value;
    const i = (state.interfaces||[]).find(x=>x.name===iface);
    const linkUp = i && i.linkUp !== false && !i.disabled;
    const out = c.querySelector('#cd-out');
    out.textContent = `TDR test started on ${iface}.\nThis may take a few seconds...\n\n`;
    setTimeout(()=>{
      const lines = [
        `TDR test results for interface ${iface}`,
        `  Test status                      : Completed`,
        `  Interface name                   : ${iface}`,
        `  Local link status                : ${linkUp?'Up':'Down'}`,
        `  Local PHY type                   : ${linkUp?'Auto-negotiated':'No-link'}`,
        `  Local speed solution             : ${linkUp?'1000 Mbps':'Unknown'}`,
        `  Local duplex solution            : ${linkUp?'Full duplex':'Unknown'}`,
        `  Local pair swap                  : MDI`,
        `  Local skew time                  : ${linkUp?'0':'-'} ns`,
        `  Local polarity                   : Normal`,
        `  Local downshift                  : No`,
        `  MDI pair                         : 1-2`,
        `    Cable status                   : ${linkUp?'Normal':'Open'}`,
        `    Distance fault                 : ${linkUp?'-':Math.floor(Math.random()*100)+'m'}`,
        `  MDI pair                         : 3-6`,
        `    Cable status                   : ${linkUp?'Normal':'Short within pair'}`,
        `  MDI pair                         : 4-5`,
        `    Cable status                   : ${linkUp?'Normal':'Open'}`,
        `  MDI pair                         : 7-8`,
        `    Cable status                   : ${linkUp?'Normal':'Open'}`,
      ];
      out.textContent = lines.join('\n');
      toast('TDR test complete','success');
    }, 1200);
  };
  c.querySelector('#cd-show').onclick=()=>{ c.querySelector('#cd-go').click(); };
  return c;
});

// TROUBLESHOOT: Log Viewer
// ============================================================================
registerRoute('troubleshoot/log-viewer', () => {
  const c = el('div');
  const files = ['messages','interactive-commands','chassisd','dcd','jweb','rpd','authd','dfwd','escript.log','snmpd'];
  c.innerHTML = `
    <div class="card"><div class="card-h"><h2>Log Viewer</h2></div><div class="card-b">
      <div class="form-row"><label>Log file</label><select id="lv-f">${files.map(f=>`<option>${f}</option>`).join('')}</select></div>
      <div class="form-row"><label>Filter (grep)</label><input id="lv-g" placeholder="UI_COMMIT"></div>
      <div class="form-row"><label>Lines</label><input id="lv-n" type="number" value="50"></div>
      <div class="form-row"><label>Follow tail</label><select id="lv-tail"><option value="no">no</option><option value="yes">yes</option></select></div>
      <div class="actions"><button class="btn primary" id="lv-go">Show</button> <button class="btn" id="lv-clear">Clear</button> <button class="btn" id="lv-dl">Download</button></div>
      <pre id="lv-out" class="cli-output" style="margin-top:14px">(no output yet)</pre>
    </div></div>
  `;
  c.querySelector('#lv-clear').onclick=()=>c.querySelector('#lv-out').textContent='(cleared)';
  c.querySelector('#lv-go').onclick=()=>{
    const f = c.querySelector('#lv-f').value;
    const g = c.querySelector('#lv-g').value;
    let txt = synthesizeLogContent(f);
    if (g) {
      const re = new RegExp(g, 'i');
      txt = txt.split('\n').filter(l=>re.test(l)).join('\n') || '(no matching lines)';
    }
    c.querySelector('#lv-out').textContent = txt;
  };
  c.querySelector('#lv-dl').onclick=()=>{
    const f = c.querySelector('#lv-f').value;
    const blob = new Blob([synthesizeLogContent(f)], {type:'text/plain'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = f; a.click();
    toast('Log downloaded','success');
  };
  return c;
});
